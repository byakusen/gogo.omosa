<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>アナログはかり（1kg / 2kg）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --worktop-1:#e9e6de; --worktop-2:#d9d4c8;
    --chassis-1:#2b3242; --chassis-2:#161b26;
    --enamel:#fbfaf6; --enamel-edge:#e9e3d6;
    --ink:#1b2230; --ink-soft:#5a6273;
    --needle:#e23a2c; --needle-dark:#a81b13;
    --brass:#e0a23b; --brass-dark:#b97f23;
    --screen-dark:#0c1512; --screen-glow:#7cf1c6;
    --ok:#43c08a; --ng:#ef8a5a;
    --line:rgba(255,255,255,.08);
    --kw:clamp(170px,19vw,300px);   /* テンキーの幅 */
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 90% at 50% -10%, #f3f1ea 0%, var(--worktop-1) 45%, var(--worktop-2) 100%);
    overflow:hidden;
    padding:clamp(8px,1.6vh,18px) clamp(10px,1.6vw,22px);
  }
  .stage{height:100%;display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px);max-width:2200px;margin:0 auto}
  .titlebar{flex:none;text-align:center}
  .titlebar h1{font-size:clamp(16px,3.2vh,26px);font-weight:900;margin:0;letter-spacing:.04em;line-height:1.2}

  .device{
    flex:1;min-height:0;
    display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"dial tabs pad" "dial main pad";row-gap:clamp(10px,2vh,20px);
    gap:clamp(12px,2.2vw,32px);align-items:center;
    background:linear-gradient(160deg,var(--chassis-1),var(--chassis-2));
    border-radius:28px;padding:clamp(10px,2.2vh,24px) clamp(14px,2vw,28px);color:#eef1f6;
    box-shadow:0 1px 0 rgba(255,255,255,.10) inset,0 -2px 0 rgba(0,0,0,.35) inset,
      0 22px 50px -18px rgba(13,18,28,.6),0 6px 16px -8px rgba(13,18,28,.5);
  }

  /* 左：はかり */
  .dialwrap{grid-area:dial;align-self:center;height:100%;aspect-ratio:1/1;max-width:38vw;min-height:0;display:flex;align-items:center;justify-content:center}
  .dial{width:100%;height:100%;touch-action:none;outline:none}
  .dial:focus-visible .bezel{stroke:var(--screen-glow)}
  .needleHit{cursor:grab}
  /* はなまる（正解のとき、答えの欄の上に出る。位置と大きさは JS の placeHana で決める） */
  .main{position:relative}
  .hanamaru{position:absolute;left:50%;top:50%;width:160px;height:auto;pointer-events:none;opacity:0;z-index:5;
    transform:translate(-50%,-50%) scale(.5) rotate(-15deg);transition:opacity .3s,transform .3s;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
  .hanamaru.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);
    transition:opacity .12s,transform .4s cubic-bezier(.2,1.6,.4,1)}
  .dial.locked .needleHit{cursor:default}
  .needleHit:active{cursor:grabbing}

  /* 中央：操作と問題 */
  .main{grid-area:main;min-height:0;max-height:100%;display:flex;flex-direction:column;align-self:stretch;align-items:center;justify-content:flex-start;gap:clamp(8px,1.6vh,16px)}

  .modebar{display:flex;gap:4px;background:rgba(0,0,0,.30);border:1px solid var(--line);
    border-radius:999px;padding:4px;max-width:100%;flex-wrap:wrap;justify-content:center}
  .modebar button{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(14px,2.4vh,20px);white-space:nowrap;
    color:#c7ccd8;background:transparent;padding:clamp(7px,1.3vh,12px) clamp(10px,1.1vw,18px);border-radius:999px;letter-spacing:.02em;transition:.18s}
  .tabs{grid-area:tabs;align-self:end;display:flex;justify-content:center;container-type:inline-size;padding-top:clamp(4px,3vh,40px)}
  .main{align-self:start;height:100%}
  @container (max-width:380px){ .modebar{display:grid;grid-template-columns:1fr 1fr;border-radius:18px} }
  .modebar button.active{color:#3a2a08;background:linear-gradient(180deg,#f0b653,var(--brass));
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 6px rgba(0,0,0,.3)}
  .modebar button:focus-visible{outline:2px solid var(--screen-glow);outline-offset:2px}

  .range{display:flex;gap:4px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:999px;padding:4px}
  .range button{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(14px,2.3vh,19px);
    color:#aab1c0;background:transparent;padding:clamp(4px,.9vh,8px) 16px;border-radius:999px;transition:.18s}
  .range button .u{font-size:.75em;opacity:.7;margin-left:2px}
  .range button.active{color:#13211c;background:rgba(124,241,198,.85);box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .range button:focus-visible{outline:2px solid var(--screen-glow);outline-offset:2px}
  .range.hide{visibility:hidden}

  .screen{width:min(100%,320px);background:linear-gradient(180deg,#0a120f,var(--screen-dark));
    border:1px solid rgba(0,0,0,.6);border-radius:14px;padding:clamp(4px,1vh,10px) 18px;text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.4) inset,0 1px 0 rgba(255,255,255,.06);transition:box-shadow .25s}
  .screen .label{font-size:clamp(10px,1.5vh,12px);letter-spacing:.3em;color:#3f5a4f;font-weight:700;margin-bottom:2px;transition:.25s}
  .screen .value{font-family:"Klee One","Zen Kaku Gothic New",serif;font-weight:600;font-size:clamp(22px,5vh,38px);line-height:1.15;color:#2c4a3f;transition:.25s}
  .screen .label:empty{display:none}
  .screen.lit .label{color:#5fae90}
  .screen.lit .value{color:var(--screen-glow);text-shadow:0 0 8px rgba(124,241,198,.55),0 0 2px rgba(124,241,198,.9)}
  .screen.lit{box-shadow:0 2px 10px rgba(0,0,0,.4) inset,0 0 0 1px rgba(124,241,198,.18),0 0 16px -4px rgba(124,241,198,.25)}

  .panel{width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,20px);margin-top:clamp(6px,1.8vh,18px)}
  .q{font-family:"Klee One","Zen Kaku Gothic New",serif;font-weight:600;text-align:center;font-size:clamp(17px,3.4vh,28px);color:#eef1f6;margin:0}
  .inputrow{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;
    font-family:"Klee One",serif;font-weight:600;font-size:clamp(20px,min(4.2vh,2.6vw),34px);color:#eef1f6;gap:10px}
  .inputrow input{width:4.2em;font-family:"Klee One",serif;font-weight:600;font-size:clamp(24px,min(6vh,2.9vw),52px);line-height:1.2;text-align:center;
    padding:clamp(4px,1vh,10px) 6px;border-radius:12px;border:none;background:#fbfaf6;color:#1b2230;caret-color:transparent;cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 2px 6px rgba(0,0,0,.3)}
  .inputrow input.active{outline:3px solid var(--screen-glow);outline-offset:2px}
  .inputrow input:focus{outline:none}
  .inputrow input#ansKg{width:2.4em}
  .inputrow input.active{outline:3px solid var(--screen-glow);outline-offset:2px}

  .pad{display:flex;flex-wrap:wrap;gap:clamp(12px,2.2vh,22px) clamp(10px,1vw,16px);margin-top:clamp(6px,1.8vh,18px);justify-content:center}
  .btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(15px,2.5vh,21px);
    padding:clamp(9px,1.6vh,15px) clamp(13px,1.3vw,20px);border-radius:12px;transition:transform .08s,filter .15s,background .15s}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--screen-glow);outline-offset:2px}
  .btn.primary{color:#3a2a08;background:linear-gradient(180deg,#f0b653,var(--brass));
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 3px 8px -2px rgba(0,0,0,.4)}
  .btn.primary:hover{filter:brightness(1.04)}
  .btn.ghost{color:#dfe4ee;background:rgba(255,255,255,.06);box-shadow:0 0 0 1px var(--line) inset}
  .btn.ghost:hover{background:rgba(255,255,255,.12)}
  .btn.reveal{color:var(--screen-glow);background:rgba(124,241,198,.08);box-shadow:0 0 0 1px rgba(124,241,198,.3) inset}
  .btn.reveal:hover{background:rgba(124,241,198,.16)}

  .feedback{font-family:"Klee One",serif;font-weight:600;text-align:center;font-size:clamp(15px,2.6vh,20px);min-height:2.3em;line-height:1.25}
  .feedback.ok{color:var(--ok)} .feedback.ng{color:var(--ng)}
  .feedback small{display:block;font-size:.78em;color:#c2c8d4;margin-top:2px;font-weight:400}
  .score{text-align:center;font-size:clamp(13px,2vh,16px);color:#aab1c0;letter-spacing:.04em}

  .obj{text-align:center;display:flex;align-items:center;justify-content:center;gap:.4em}
  .obj .emoji{font-size:clamp(30px,6.5vh,58px);line-height:1}
  .obj .btn.hint{margin-left:.6em}
  .obj .objname{font-family:"Klee One",serif;font-weight:600;font-size:clamp(15px,2.7vh,21px);color:#eef1f6;margin-top:2px}

  /* ヒント */
  .qrow{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1vw,14px);flex-wrap:wrap}
  .btn.hint{font-size:clamp(13px,2.1vh,18px);padding:clamp(5px,.9vh,9px) clamp(10px,1vw,16px);border-radius:999px;
    color:#ffd166;background:rgba(255,209,102,.10);box-shadow:0 0 0 1px rgba(255,209,102,.5) inset}
  .btn.hint:hover{background:rgba(255,209,102,.18)}
  .feedback.hint{color:#ffd166}
  .btn.hint.on{color:#3a2a08;background:#ffd166;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  /* g → kg のヒント（表示画面への書きこみ） */
  .screen .value .strike{position:relative;display:inline-block}
  .screen .value .strike::after{content:'';position:absolute;left:50%;top:50%;width:1.6em;height:.09em;min-height:3px;border-radius:2px;
    background:#ffd84d;box-shadow:0 0 4px rgba(255,216,77,.7);transform:translate(-50%,-50%) rotate(52deg)}
  .screen .value .addz{color:#ffd84d;text-shadow:0 0 6px rgba(255,216,77,.6)}
  .screen .value .ins{position:relative;display:inline-block;width:.12em}
  .screen .value .caret{position:absolute;left:50%;bottom:.62em;width:2.3em;height:auto;transform:translateX(-50%);overflow:visible;
    text-shadow:none;filter:none}   /* 光らせると kg がにじむので、光はつけない */
  .note{font-size:clamp(13px,2vh,16px);color:#9aa2b2;text-align:center;margin:0}

  /* 10問チャレンジ（challenge10.js の見た目を、この画面に合わせて少し大きく） */
  #chal-mount{margin-top:auto;padding-bottom:clamp(2px,1vh,10px)}
  #chal-mount.hide{display:none}
  .main.chal-on .score{display:none}  /* チャレンジ中は帯（○●）があるので、正解数の行はかくす */
  #chal-wrap{justify-content:center}
  .chal-btn{font-size:clamp(14px,2.3vh,19px)!important;padding:clamp(6px,1.1vh,10px) 18px!important}
  #chal-bar{font-size:clamp(13px,2.1vh,17px)}
  #chal-dots{font-size:clamp(14px,2.4vh,20px)!important}
  .btn:disabled{opacity:.35;cursor:default}

  /* 右：テンキー */
  .keypad{grid-area:pad;align-self:center;width:var(--kw);height:calc(var(--kw)*1.55);max-height:100%;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr) 1.15fr;gap:clamp(5px,1vh,10px);
    padding:clamp(8px,1.2vh,12px);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:20px;transition:opacity .2s}
  .key{appearance:none;border:none;cursor:pointer;font-family:"Klee One","Zen Kaku Gothic New",serif;font-weight:600;
    font-size:clamp(20px,4.2vh,34px);color:#1b2230;background:linear-gradient(180deg,#ffffff,#e9e5da);border-radius:12px;
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 3px 0 #a9a394,0 5px 10px -4px rgba(0,0,0,.5);
    touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .06s,box-shadow .06s}
  .key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 0 0 #a9a394,0 2px 4px -2px rgba(0,0,0,.5)}
  .key:focus-visible{outline:3px solid var(--screen-glow);outline-offset:2px}
  .key.fn{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:clamp(14px,2.6vh,20px);color:#dfe4ee;
    background:rgba(255,255,255,.08);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 3px 0 rgba(0,0,0,.45)}
  .key.enter{grid-column:1 / -1;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:clamp(16px,3vh,24px);color:#3a2a08;
    background:linear-gradient(180deg,#f0b653,var(--brass));box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 3px 0 var(--brass-dark),0 6px 12px -4px rgba(0,0,0,.5)}
  .keypad.off{opacity:.28;pointer-events:none}

  /* たて長の画面（タブレットのたて向きなど） */
  @media (max-aspect-ratio: 1/1){
    :root{--kw:clamp(170px,36vw,280px)}
    .device{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;
      grid-template-areas:"tabs tabs" "dial dial" "main pad";border-radius:22px}
    .dialwrap{max-width:100%;justify-self:center;height:100%}
    .tabs{padding-top:0}
    .main{height:auto}
    .keypad{height:calc(var(--kw)*1.4)}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
  <div class="stage">
    <div class="titlebar"><h1>アナログはかり</h1></div>

    <div class="device">
      <div class="dialwrap">
<svg id="dial" class="dial" viewBox="0 0 440 440" tabindex="0" role="slider" aria-label="はかりの針" aria-valuemin="0">
          <defs>
            <radialGradient id="faceGrad" cx="50%" cy="42%" r="62%">
              <stop offset="0%" stop-color="#ffffff"/><stop offset="78%" stop-color="var(--enamel)"/><stop offset="100%" stop-color="var(--enamel-edge)"/>
            </radialGradient>
            <linearGradient id="bezelGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#444c5e"/><stop offset="50%" stop-color="#2a3140"/><stop offset="100%" stop-color="#10141d"/>
            </linearGradient>
            <radialGradient id="hubGrad" cx="40%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#fdfdfd"/><stop offset="55%" stop-color="#cdd3dd"/><stop offset="100%" stop-color="#7c8392"/>
            </radialGradient>
            <filter id="needleShadow" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.28"/>
            </filter>
          </defs>
          <circle cx="220" cy="220" r="212" fill="url(#bezelGrad)"/>
          <circle class="bezel" cx="220" cy="220" r="206" fill="none" stroke="#5b6377" stroke-width="2" opacity="0.6"/>
          <circle cx="220" cy="220" r="198" fill="url(#faceGrad)"/>
          <circle cx="220" cy="220" r="198" fill="none" stroke="#d8d2c4" stroke-width="1.5"/>
          <g id="hintMarks"></g>
          <!-- ヒント用：針の先から目もりの手前までのばす赤い線。目もりにかさならないよう、その目もりの内側のはしの少し手前で止める（長さは dialHint で決める）。針といっしょに回す -->
          <g id="needleExtG" transform="rotate(0 220 220)">
            <line id="needleExt" x1="220" y1="54" x2="220" y2="24" stroke="var(--needle)" stroke-width="2.2" stroke-linecap="round" visibility="hidden"/>
          </g>
          <g id="ticks" stroke="var(--ink)"></g>
          <g id="labels" fill="var(--ink)"></g>
          <text id="unitMark" x="220" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="var(--ink-soft)" letter-spacing="2" font-family='"Klee One","Zen Kaku Gothic New",serif'>g</text>
          <g id="needle" transform="rotate(0 220 220)" filter="url(#needleShadow)">
            <g id="needleHit" class="needleHit">
              <polygon id="needlePoly" fill="var(--needle)" stroke="var(--needle-dark)" stroke-width="1.5"/>
              <rect x="213" y="232" width="14" height="26" rx="6" fill="var(--needle-dark)"/>
              <circle cx="220" cy="220" r="14" fill="url(#hubGrad)"/>
              <circle cx="220" cy="220" r="14" fill="none" stroke="#5a6170" stroke-width="2"/>
              <circle cx="220" cy="220" r="4.5" fill="#3a4150"/>
            </g>
          </g>
          <g id="hintTop"></g>  <!-- ヒントの数字と赤い四角（針より上にかく） -->

     Challenge10.isOn()        … いまチャレンジ中か
     Challenge10.stop()        … チャレンジをやめる

   ■ init に わたせるもの（ぜんぶ省略できます）
     mount       ボタンを置く場所。'#id' か 要素。省略すると <body> の先頭

     next        次の問題を出す関数。これがないと自動で次に進みません

(function (global) {
    'use strict';

    var CSS = `
    .chal-btn {

    #chal-result {

        align-items: center; justify-content: center;

        background: #fff; border-radius: 20px; padding: 28px 34px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; max-width: 90vw;
    }

    .chal-lines { font-size: 1.25rem; font-weight: bold; color: #333; line-height: 2; }
    .chal-lines b { color: #e53935; font-size: 1.5rem; }
    .chal-msg { margin-top: 10px; color: #ff6f00; }
    .chal-best { margin-top: 6px; font-size: 1rem; color: #6a1b9a; }
    .chal-btns { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
    .chal-btns button {
        padding: 12px 20px; font-size: 1.1rem; font-weight: bold; font-family: inherit;
        border-radius: 14px; cursor: pointer; border: none;
    }
    #btn-chal-again { color: #fff; background: #8e24aa; box-shadow: 0 3px 0 #4a148c; }
    #btn-chal-quit  { color: #6a1b9a; background: #f3e5f5; border: 2px solid #ce93d8; }
    @media (prefers-reduced-motion: reduce) { .chal-btn, .chal-btns button { transition: none; } }
    `;

    var BAR_HTML =
        '<button id="btn-challenge" class="chal-btn" type="button"></button>' +
        '<div id="chal-bar"><span id="chal-dots"></span><span id="chal-count"></span></div>';

    var RESULT_HTML =
        '<div class="chal-card">' +
        '  <div class="chal-title">🏁 <span id="chal-total-title"></span>問 できました！</div>' +
        '  <div class="chal-lines" id="chal-lines"></div>' +
        '  <div class="chal-btns">' +
        '    <button id="btn-chal-again" type="button">もう一度チャレンジ</button>' +
        '    <button id="btn-chal-quit" type="button">やめる</button>' +
        '  </div>' +
        '</div>';

    var cfg = null;
    var chal = { on: false, total: 10, no: 0, miss: 0, missNow: 0, perfect: 0, t0: 0 };
    var $ = function (id) { return document.getElementById(id); };

    // --- きょうの記録（localStorage。使えないときは だまって何もしない）---
    function todayKey() {
        var d = new Date();
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }
    function loadBest() {
        if (!cfg.record) return null;
        try {
            var raw = localStorage.getItem(cfg.recordKey);
            if (!raw) return null;
            var o = JSON.parse(raw);
            // その日の記録だけ／問題数がちがう記録はまぜない
            return (o && o.day === todayKey() && o.total === chal.total) ? o : null;
        } catch (e) { return null; }
    }
    function saveBest(perfect, sec) {
        if (!cfg.record) return null;
        var best = loadBest();
        // ノーミスの数が多いほうが上。同じなら 時間が短いほう
        if (best && (best.perfect > perfect || (best.perfect === perfect && best.sec <= sec))) return best;
        var o = { day: todayKey(), perfect: perfect, sec: sec, total: chal.total };
        try { localStorage.setItem(cfg.recordKey, JSON.stringify(o)); } catch (e) { }
        return o;
    }

    // --- 帯（○○○●…）の書きかえ ---
    function chalUpdateBar() {
        $('btn-challenge').classList.toggle('on', chal.on);
        $('chal-bar').style.display = chal.on ? 'flex' : 'none';
        if (!chal.on) return;
        var dots = '';
        for (var i = 0; i < chal.total; i++) dots += (i < chal.no) ? '●' : '○';
        $('chal-dots').innerText = dots;
        $('chal-count').innerText = Math.min(chal.no + 1, chal.total) + '問め / ' + chal.total;
    }

    // --- はじめから数えなおす ---
    function chalReset() {
        chal.no = 0; chal.miss = 0; chal.missNow = 0; chal.perfect = 0; chal.t0 = Date.now();
        $('chal-result').classList.remove('show');
        chalUpdateBar();
    }

    // --- 1問おわったときに呼ぶ ---
    function chalDone() {
        if (!chal.on) return;
        if (chal.missNow === 0) chal.perfect++;
        chal.no++;

        if (chal.no < chal.total) {
            setTimeout(function () {         // つぎの問題へ
                if (!chal.on) return;
                chal.missNow = 0;
                if (cfg.next) cfg.next();
            }, cfg.nextDelay);
            return;
        }
        var sec = Math.floor((Date.now() - chal.t0) / 1000);
        var msg = (chal.perfect === chal.total) ? 'ぜんぶノーミス！ すばらしい！'
                : (chal.perfect >= chal.total - 2) ? 'よくがんばりました！'
                : 'つぎは もっとできる！';
        var best = saveBest(chal.perfect, sec);
        var result = { perfect: chal.perfect, miss: chal.miss, sec: sec, total: chal.total };
        setTimeout(function () {
            $('chal-total-title').innerText = chal.total;
            $('chal-lines').innerHTML =
                '<div>ノーミスでできた問題　<b>' + chal.perfect + '</b> / ' + chal.total + '</div>' +
                '<div>まちがえた回数　<b>' + chal.miss + '</b> 回</div>' +
                '<div>かかった時間　<b>' + Math.floor(sec / 60) + '</b> 分 <b>' + (sec % 60) + '</b> 秒</div>' +
                '<div class="chal-msg">' + msg + '</div>' +
                (best ? '<div class="chal-best">きょうの最高記録　ノーミス ' + best.perfect + ' / ' + best.total +
                        ' 問　　' + Math.floor(best.sec / 60) + '分' + (best.sec % 60) + '秒</div>' : '');
            $('chal-result').classList.add('show');
            $('btn-chal-again').focus();
            if (cfg.onFinish) cfg.onFinish(result);
        }, cfg.resultDelay);
    }

    // --- はじめの用意 ---
    function init(opt) {
        opt = opt || {};
        cfg = {
            total: opt.total || 10,
            next: opt.next || null,
            nextDelay: (opt.nextDelay === undefined) ? 1800 : opt.nextDelay,
            resultDelay: (opt.resultDelay === undefined) ? 1500 : opt.resultDelay,
            label: opt.label || '🏁 10問チャレンジ',
            sound: opt.sound || null,
            onToggle: opt.onToggle || null,
            onFinish: opt.onFinish || null,
            record: !!opt.record,
            recordKey: opt.recordKey || 'challenge10',
            css: (opt.css === undefined) ? true : opt.css
        };
        chal.total = cfg.total;
        if (opt.label === undefined && cfg.total !== 10) cfg.label = '🏁 ' + cfg.total + '問チャレンジ';

        // CSS
        if (cfg.css && !$('chal-style')) {
            var st = document.createElement('style');
            st.id = 'chal-style';
            st.textContent = CSS;
            document.head.appendChild(st);
        }
        // ボタンと帯
        var host = (typeof opt.mount === 'string') ? document.querySelector(opt.mount) : opt.mount;
        var wrap = $('chal-wrap');
        if (!wrap) {
            wrap = document.createElement('div');
            wrap.id = 'chal-wrap';
            wrap.innerHTML = BAR_HTML;
            if (host) host.appendChild(wrap);
            else document.body.insertBefore(wrap, document.body.firstChild);
        }
        // 成せき表
        if (!$('chal-result')) {
            var res = document.createElement('div');
            res.id = 'chal-result';
            res.innerHTML = RESULT_HTML;
            document.body.appendChild(res);
        }
        $('btn-challenge').innerText = cfg.label;

        $('btn-challenge').addEventListener('click', function () {
            chal.on = !chal.on;
            if (cfg.sound) cfg.sound();
            chalReset();
            if (cfg.onToggle) cfg.onToggle(chal.on);
            if (cfg.next) cfg.next();
        });
        $('btn-chal-again').addEventListener('click', function () {
            chalReset();
            if (cfg.next) cfg.next();
        });
        $('btn-chal-quit').addEventListener('click', function () {
            chal.on = false;
            chalReset();
            if (cfg.onToggle) cfg.onToggle(false);
            if (cfg.next) cfg.next();
        });

        chalUpdateBar();
        return API;
    }

    var API = {
        init: init,
        done: chalDone,                                        // 1問できた
        miss: function () { if (chal.on) { chal.miss++; chal.missNow++; } },  // まちがえた
        newProblem: function () { chal.missNow = 0; },          // 新しい問題を出した
        reset: chalReset,                                       // 数えなおす
        stop: function () { chal.on = false; chalReset(); },    // やめる
        isOn: function () { return chal.on; },
        updateBar: chalUpdateBar,
        setTotal: function (n) { chal.total = cfg.total = n; chalReset(); },
        state: chal
    };

    global.Challenge10 = API;
    if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
(function(){
  const CX=220, CY=220, R_TICK=192;
  const svg=document.getElementById('dial');
  const ticksG=document.getElementById('ticks');
  const labelsG=document.getElementById('labels');
  const needle=document.getElementById('needle');
  const needleHit=document.getElementById('needleHit');
  const needlePoly=document.getElementById('needlePoly');
  const readout=document.getElementById('readout');
  const screen=document.getElementById('screen');
  const screenLabel=document.getElementById('screenLabel');
  const unitMark=document.getElementById('unitMark');
  const panel=document.getElementById('panel');
  const rangeBar=document.getElementById('rangeBar');
  const keypad=document.getElementById('keypad');
  const enterKey=document.getElementById('enterKey');
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const CONFIG={
    1000:{max:1000,minor:5, ten:10, mid:50, major:100, labelStep:100, big:[500]},
    2000:{max:2000,minor:10,half:50,mid:100,major:200, labelStep:200, big:[1000], midLen:18, label:g=>(g===1000?'1kg':g)}
  };
  let cfg=CONFIG[1000];
  let mode='practice', grams=0, dragging=false, answerHidden=true, animId=null;

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const toAngle=g=>g/cfg.max*360;
  function polar(radius,deg){const rad=(deg-90)*Math.PI/180;return{x:CX+radius*Math.cos(rad),y:CY+radius*Math.sin(rad)};}

  // 目もりの線の長さ（drawScale と 針の先の赤線で使う）
  function tickLen(g){
    const isMajor=g%cfg.major===0, isMid=!isMajor&&g%cfg.mid===0;
    const isTen=!!cfg.ten&&!isMajor&&!isMid&&g%cfg.ten===0;
    const isFive=!!cfg.ten&&!isMajor&&!isMid&&!isTen;
    const isHalf=!!cfg.half&&!isMajor&&!isMid&&g%cfg.half===0;
    return isMajor?22:isMid?(cfg.midLen||13):isHalf?14:isTen?10:isFive?5:7;
  }
  function drawScale(){
    ticksG.innerHTML=''; labelsG.innerHTML='';
    for(let g=0; g<cfg.max; g+=cfg.minor){
      const deg=toAngle(g);
      const isMajor=g%cfg.major===0, isMid=!isMajor&&g%cfg.mid===0;
      const isTen=!!cfg.ten&&!isMajor&&!isMid&&g%cfg.ten===0;   // 10gのめもり
      const isFive=!!cfg.ten&&!isMajor&&!isMid&&!isTen;          // 5g,15g,25g…のめもり（10gの半分の長さ）
      const isHalf=!!cfg.half&&!isMajor&&!isMid&&g%cfg.half===0; // 2kgはかりの50gのめもり（10gの2倍の長さ）
      const len=isMajor?22:isMid?(cfg.midLen||13):isHalf?14:isTen?10:isFive?5:7;
      const p1=polar(R_TICK,deg), p2=polar(R_TICK-len,deg);
      const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('x1',p1.x);ln.setAttribute('y1',p1.y);ln.setAttribute('x2',p2.x);ln.setAttribute('y2',p2.y);
      ln.setAttribute('stroke-width',isMajor?3:isMid?(cfg.midLen?2:1.6):isHalf?1.4:1);ln.setAttribute('stroke-linecap','round');
      if(!isMajor&&!isMid) ln.setAttribute('opacity',isHalf?'0.85':isTen?'0.8':'0.55');
      ticksG.appendChild(ln);
    }
    const lab=cfg.label||(g=>g);
    for(let g=0; g<cfg.max; g+=cfg.labelStep){
      addLabel(g, lab(g), cfg.big.includes(g)?27:22);
    }
    addLabel(0,'0',22);
  }
  function addLabel(g,text,size){
    const pos=polar(R_TICK-40,toAngle(g));
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',pos.x);t.setAttribute('y',pos.y);t.setAttribute('font-size',size);t.setAttribute('font-weight',600);
    t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','central');
    t.setAttribute('font-family','"Klee One","Zen Kaku Gothic New",serif');
    t.textContent=text; labelsG.appendChild(t);
  }
  (function buildNeedle(){
    const baseW=13,tipW=2,length=167;  // 針の先が目盛りの線の手前で止まる長さ
    const pts=[[CX-baseW/2,CY],[CX+baseW/2,CY],[CX+tipW/2,CY-length],[CX-tipW/2,CY-length]];
    needlePoly.setAttribute('points',pts.map(p=>p.join(',')).join(' '));
  })();

  function fmtG(g){return g+' g';}
  function fmtKgG(g){ if(g>=1000){const kg=Math.floor(g/1000),rem=g%1000;return kg+' kg'+(rem?' '+rem+' g':'');} return g+' g'; }
  function screenValue(g){ return cfg.max===1000? fmtG(g) : fmtKgG(g); }

  const needleExtG=document.getElementById('needleExtG');
  function setNeedleRot(deg){ const t=`rotate(${deg} ${CX} ${CY})`; needle.setAttribute('transform',t); needleExtG.setAttribute('transform',t); }
  function setNeedle(g){
    grams=clamp(Math.round(g/cfg.minor)*cfg.minor,0,cfg.max);
    setNeedleRot(toAngle(grams));
    svg.setAttribute('aria-valuenow',grams);svg.setAttribute('aria-valuemax',cfg.max);svg.setAttribute('aria-valuetext',screenValue(grams));
  }
  function animateTo(target,onDone){
    target=clamp(Math.round(target/cfg.minor)*cfg.minor,0,cfg.max);
    if(reduceMotion){ setNeedle(target); onDone&&onDone(); return; }
    if(animId) cancelAnimationFrame(animId);
    const startAngle=toAngle(grams);
    let delta=toAngle(target)-startAngle;
    if(delta>180)delta-=360; if(delta<-180)delta+=360;
    const dur=700,t0=performance.now();
    grams=target; svg.setAttribute('aria-valuenow',grams);
    function step(now){
      const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
      setNeedleRot(startAngle+delta*e);
      if(p<1) animId=requestAnimationFrame(step);
      else{ animId=null; setNeedle(target); onDone&&onDone(); }
    }
    animId=requestAnimationFrame(step);
  }
  function showScreen(text,lit){ readout.textContent=text; screen.classList.toggle('lit',!!lit); }

  /* ---------- drag / keyboard (practice only) ---------- */
  function angleFromEvent(e){
    const r=svg.getBoundingClientRect();
    let deg=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI;
    return ((deg+90)%360+360)%360;
  }
  needleHit.addEventListener('pointerdown',e=>{ if(mode!=='practice')return; dragging=true; if(animId)cancelAnimationFrame(animId); needleHit.setPointerCapture?.(e.pointerId); });
  window.addEventListener('pointermove',e=>{ if(dragging&&mode==='practice'){ setNeedle(angleFromEvent(e)/360*cfg.max); practiceMoved(); if(!answerHidden) showScreen(screenValue(grams),true);} });
  window.addEventListener('pointerup',()=>{dragging=false;});
  svg.addEventListener('keydown',e=>{
    if(mode!=='practice')return;
    const step=e.shiftKey?cfg.major:cfg.minor; let used=true;
    if(e.key==='ArrowRight'||e.key==='ArrowUp')setNeedle(grams+step);
    else if(e.key==='ArrowLeft'||e.key==='ArrowDown')setNeedle(grams-step);
    else if(e.key==='Home')setNeedle(0);
    else if(e.key==='End')setNeedle(cfg.max);
    else used=false;
    if(used){ practiceMoved(); if(!answerHidden) showScreen(screenValue(grams),true); e.preventDefault(); }
  });

  /* ---------- helpers for inputs ---------- */
  const INP='type="text" inputmode="none" autocomplete="off" spellcheck="false"';
  function inputsHTML(twoFields){
    if(twoFields) return `<input id="ansKg" ${INP} maxlength="1" aria-label="キログラム"> kg <input id="ansG" ${INP} maxlength="3" aria-label="グラム"> g`;
    return `<input id="ansG" ${INP} maxlength="4" aria-label="グラム"> g`;
  }
  function readAnswer(twoFields){
    const g=document.getElementById('ansG');
    if(twoFields){
      const kg=document.getElementById('ansKg');
      if(kg.value.trim()===''&&g.value.trim()==='')return null;
      return (parseInt(kg.value,10)||0)*1000+(parseInt(g.value,10)||0);
    }
    if(g.value.trim()==='')return null;
    return parseInt(g.value,10)||0;
  }
  /* ---------- テンキー ---------- */
  let activeInput=null, checkFn=null, nextFn=null, answered=false;
  function setActive(inp){ activeInput=inp; panel.querySelectorAll('.inputrow input').forEach(i=>i.classList.toggle('active',i===inp)); }
  function setAnswered(v){ answered=v; enterKey.textContent=v?'つぎへ ▶':'けってい'; updHintBtn(); }
  function doEnter(){ if(answered){ if(chalOn())return; nextFn&&nextFn(); } else { checkFn&&checkFn(); } }
  const chalOn=()=>window.Challenge10&&Challenge10.isOn()&&(mode==='quiz'||mode==='convert');
  // 入力欄の準備：fn=こたえあわせ, next=つぎのもんだい
  function onEnter(fn,next){
    checkFn=fn; nextFn=next||null;
    panel.querySelectorAll('.inputrow input').forEach(i=>{
      i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); doEnter(); } });
      i.addEventListener('focus',()=>setActive(i));
      i.addEventListener('pointerdown',()=>setActive(i));
      i.addEventListener('input',()=>{ const m=i.maxLength>0?i.maxLength:4; i.value=i.value.replace(/[^0-9]/g,'').slice(0,m); });
    });
  }
  // startG=true のときは、はじめの入力先をgの欄にする（2kgのクイズで答えが1kgより小さいとき）
  let startG=false;
  function firstInput(){ return (startG&&document.getElementById('ansG'))||panel.querySelector('.inputrow input'); }
  function focusFirst(){ const i=firstInput(); if(i){ setActive(i); i.focus({preventScroll:true}); } }
  function pressKey(k){
    if(k==='enter'){ doEnter(); return; }
    const inputs=[...panel.querySelectorAll('.inputrow input')];
    if(!inputs.length) return;
    if(!activeInput||!inputs.includes(activeInput)) setActive(inputs[0]);
    const inp=activeInput, m=inp.maxLength>0?inp.maxLength:4;
    if(k==='clear'){ inputs.forEach(i=>i.value=''); setActive(firstInput()||inputs[0]); return; }
    if(k==='back'){
      if(inp.value==='' && inputs.indexOf(inp)>0){ const prev=inputs[inputs.indexOf(inp)-1]; prev.value=prev.value.slice(0,-1); setActive(prev); }
      else inp.value=inp.value.slice(0,-1);
      return;
    }
    if(inp.value==='0') inp.value='';
    if(inp.value.length<m) inp.value+=k;
    // kgの欄がうまったら、gの欄へ自動で移る
    if(inp.id==='ansKg' && inp.value.length>=m){ const g=document.getElementById('ansG'); g&&setActive(g); }
  }
  keypad.querySelectorAll('.key').forEach(b=>{
    b.addEventListener('pointerdown',e=>e.preventDefault()); // 入力欄のフォーカスをうばわない
    b.addEventListener('click',()=>pressKey(b.dataset.k));
  });
  // パソコンのキーボードからも入力できるように（入力欄の外にいるとき）
  document.addEventListener('keydown',e=>{
    if(mode==='practice'||e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey) return;
    const cr=document.getElementById('chal-result'); if(cr&&cr.classList.contains('show')) return;
    if(/^[0-9]$/.test(e.key)){ pressKey(e.key); e.preventDefault(); }
    else if(e.key==='Backspace'){ pressKey('back'); e.preventDefault(); }
    else if(e.key==='Enter' && e.target.tagName!=='BUTTON'){ doEnter(); e.preventDefault(); }
  });
  function randStep(lo,hi,step){ const n=Math.floor((hi-lo)/step)+1; return lo+Math.floor(Math.random()*n)*step; }

  /* ---------- ヒント（ボタンで オン／オフ） ----------
     オンにしているあいだは、次の問題でもヒントが出たまま。タブを変えるとオフ。 */
  const hintMarks=document.getElementById('hintMarks'), hintTop=document.getElementById('hintTop');
  const SVGNS='http://www.w3.org/2000/svg';
  let hintOn=false, hintFbId=null, hintRender=null, screenHinted=false;
  const needleExt=document.getElementById('needleExt');
  function clearMarks(){ hintMarks.innerHTML=''; hintTop.innerHTML=''; needleExt.setAttribute('visibility','hidden'); }
  function setupHint(fbId,renderFn){
    hintFbId=fbId; hintRender=renderFn; hintOn=false; clearMarks();
    const b=document.getElementById('hintBtn'); if(b) b.onclick=()=>{ hintOn=!hintOn; applyHint(); };
    updHintBtn();
  }
  function updHintBtn(){
    const b=document.getElementById('hintBtn'); if(!b) return;
    b.classList.toggle('on',hintOn); b.setAttribute('aria-pressed',hintOn); b.textContent='💡 ヒント';  // オンのときは黄色くぬる
  }
  function restoreScreen(){
    if(screenHinted&&mode==='convert') showScreen(cType==='toKgG'?fmtG(cVal):fmtKgG(cVal),true);
    screenHinted=false;
  }
  // ヒントを かきなおす（問題が変わったとき・オンオフしたとき・れんしゅうで針を動かしたとき）
  function applyHint(){
    clearMarks(); restoreScreen();
    const fb=document.getElementById(hintFbId);
    if(!hintOn||!hintRender){ if(fb&&fb.classList.contains('hint')){ fb.className='feedback'; fb.innerHTML=''; } updHintBtn(); return; }
    const r=hintRender();
    if(fb&&!answered&&r){ fb.className='feedback hint'; fb.innerHTML='💡 '+r.t+(r.s?'<small>'+r.s+'</small>':''); }
    updHintBtn();
  }
  function practiceMoved(){ if(mode==='practice'&&hintOn) applyHint(); }

  /* はかりにかく印 */
  function markArc(lo,hi){
    const a=polar(181,toAngle(lo)), b=polar(181,toAngle(hi)), big=(hi-lo)/cfg.max>0.5?1:0;
    const pa=document.createElementNS(SVGNS,'path');
    pa.setAttribute('d',`M${a.x} ${a.y} A181 181 0 ${big} 1 ${b.x} ${b.y}`);
    pa.setAttribute('fill','none'); pa.setAttribute('stroke','rgba(255,196,0,.38)'); pa.setAttribute('stroke-width','24');
    hintMarks.appendChild(pa);
  }
  function markTick(g){
    const a=polar(195,toAngle(g)), b=polar(163,toAngle(g));
    const ln=document.createElementNS(SVGNS,'line');
    ln.setAttribute('x1',a.x);ln.setAttribute('y1',a.y);ln.setAttribute('x2',b.x);ln.setAttribute('y2',b.y);
    ln.setAttribute('stroke','rgba(255,170,0,.85)'); ln.setAttribute('stroke-width','9'); ln.setAttribute('stroke-linecap','round');
    hintMarks.appendChild(ln);
  }
  const hasLabel=g=>(g%cfg.max)%cfg.labelStep===0;   // もともと数字がついている目もりか
  // 数字がない目もりに、オレンジの小さい数字をかく（850 など）
  function hintLabel(g){
    const pos=polar(R_TICK-40,toAngle(g));
    const t=document.createElementNS(SVGNS,'text');
    t.setAttribute('x',pos.x);t.setAttribute('y',pos.y);t.setAttribute('font-size',17);t.setAttribute('font-weight',700);
    t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','central');t.setAttribute('fill','#c46a00');
    t.setAttribute('font-family','"Klee One","Zen Kaku Gothic New",serif');
    t.setAttribute('stroke','#fff');t.setAttribute('stroke-width',5);t.setAttribute('paint-order','stroke');t.setAttribute('stroke-linejoin','round');
    t.textContent=g; hintTop.appendChild(t); return t;
  }
  // 数字を赤い四角でかこむ
  function redBox(g){
    let el=null;
    if(hasLabel(g)){ const p=polar(R_TICK-40,toAngle(g));
      el=[...labelsG.children].find(t=>Math.abs(+t.getAttribute('x')-p.x)<0.5&&Math.abs(+t.getAttribute('y')-p.y)<0.5); }
    if(el){ el=el.cloneNode(true); el.setAttribute('fill','var(--ink)');   // 針の上に出すため、数字をうつしてかく
      el.setAttribute('stroke','#fff');el.setAttribute('stroke-width',5);el.setAttribute('paint-order','stroke');el.setAttribute('stroke-linejoin','round');
      hintTop.appendChild(el); }
    else el=hintLabel(g);
    const bb=el.getBBox(), pad=5;
    const r=document.createElementNS(SVGNS,'rect');
    r.setAttribute('x',bb.x-pad);r.setAttribute('y',bb.y-pad+1);r.setAttribute('width',bb.width+pad*2);r.setAttribute('height',bb.height+pad*2-2);
    r.setAttribute('rx',3);r.setAttribute('fill','rgba(255,255,255,.9)');r.setAttribute('stroke','#e23a2c');r.setAttribute('stroke-width',3);
    hintTop.insertBefore(r,el);
  }

  // はかりを読むヒント（れんしゅう・クイズ）
  //  ・針が 数字のある目もりに ぴったり → その数字を 赤い四角で かこむ
  //  ・それ以外 → 黄色い帯で はんいを しめし、数字のない目もりに 数字を足す
  function dialHint(g){
    const two=cfg.max===2000, kgNote=(two&&g>=1000)?'1000g ＝ 1kg':'';
    if(hasLabel(g)){
      redBox(g%cfg.max);
      return {t:'赤い四角の 数字を 読もう',s:kgNote};
    }
    // 数字のない所では、針の先を目もりの手前までのばす（目もりの線にかさならないよう、すき間をあけて止める）
    needleExt.setAttribute('y2',CY-(R_TICK-tickLen(g%cfg.max)-3));
    needleExt.setAttribute('visibility','visible');
    if(g%50===0){   // 数字のない 100gや50gの目もり（まん中の目もり）に ぴったり
      const w=(g%100===0)?100:50, lo=g-w, hi=g+w;
      markArc(lo,hi); markTick(g);
      [lo,hi].forEach(v=>{ if(v<cfg.max&&!hasLabel(v)) hintLabel(v); });
      return {t:lo+'g と '+hi+'g の まん中の 目もりだよ',s:kgNote};
    }
    const lo=Math.floor(g/100)*100, hi=lo+100, ref=Math.floor(g/50)*50;
    markArc(lo,hi); markTick(ref);
    // 2kgはかりは 50gの間がせまく 数字が重なるので、まん中の数字は 1kgはかりだけ
    (two?[lo,hi]:[lo,lo+50,hi]).forEach(v=>{ if(v<cfg.max&&!hasLabel(v)) hintLabel(v); });
    return {t:ref+'g の目もりから、小さい目もりを 数えよう',s:'小さい目もり1つは '+cfg.minor+'g'+(kgNote?'。'+kgNote:'')};
  }

  // よそう：にている物と くらべる
  function predictHint(o){
    if(!o||!o.c) return null;
    return {t:o.n+'と にている '+o.c[0]+'は やく '+o.c[1],s:'それより 重いかな？ 軽いかな？'};
  }

  // g → kg：表示画面の数字に、黄色で書きこむ
  function convertHint(){
    const kg=Math.floor(cVal/1000), rem=cVal%1000;
    screenHinted=true; screen.classList.add('lit');
    if(cType==='toG'){
      const r3=String(rem).padStart(3,'0'), nz=3-String(rem).length;
      const remH='<span class="addz">'+r3.slice(0,nz)+'</span>'+r3.slice(nz);
      readout.innerHTML=kg+' <span class="strike">kg</span> '+remH+' g';
      return {t:'kg を けして、数字を つなげよう',s:nz?'黄色の 0 も わすれずに':''};
    }
    const d=String(cVal);
    readout.innerHTML='<span>'+d[0]+'</span><span class="ins"><svg class="caret" viewBox="0 0 70 80" aria-hidden="true">'+
      '<text x="35" y="27" text-anchor="middle" font-size="31" font-weight="900" fill="#ffd84d" font-family="Zen Kaku Gothic New,sans-serif">kg</text>'+
      '<polyline points="5,42 35,78 65,42" fill="none" stroke="#ffd84d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'+
      '<span>'+d.slice(1)+'</span> g';
    return {t:'千の位の 1 が 1kg、のこりが g だよ',s:'1000g ＝ 1kg'};
  }

  /* ---------- PRACTICE ---------- */
  function buildPractice(){
    screenLabel.textContent='';
    answerHidden=true; showScreen('– – –',false);
    panel.innerHTML=`<div class="pad">
      <button class="btn primary" id="rnd10">ランダム（10g）</button>
      <button class="btn primary" id="rnd100">ランダム（100g）</button>
      <button class="btn ghost" id="toZero">0にもどす</button>
      <button class="btn reveal" id="toggle">答えを表示</button>
      <button class="btn hint" id="hintBtn" type="button">💡 ヒント</button></div>
      <div class="feedback" id="hfb"></div>
      <p class="note">針をドラッグして回せます。矢印キーでも動かせます。</p>`;
    setupHint('hfb',()=>dialHint(grams));
    const tg=document.getElementById('toggle');
    document.getElementById('rnd10').onclick=()=>animateTo(randStep(0,cfg.max,10),()=>{ if(!answerHidden)showScreen(screenValue(grams),true); practiceMoved(); });
    document.getElementById('rnd100').onclick=()=>animateTo(randStep(0,cfg.max,100),()=>{ if(!answerHidden)showScreen(screenValue(grams),true); practiceMoved(); });
    document.getElementById('toZero').onclick=()=>animateTo(0,()=>{ if(!answerHidden)showScreen(screenValue(grams),true); practiceMoved(); });
    tg.onclick=()=>{ answerHidden=!answerHidden; tg.textContent=answerHidden?'答えを表示':'答えを隠す'; showScreen(answerHidden?'– – –':screenValue(grams),!answerHidden); };
  }

  /* ---------- はなまると正解音 ---------- */
  // 正解 → はなまる＋ピンポン → HANA_HIDE ms で はなまるを消す → HANA_NEXT ms で次の問題へ
  const HANA_HIDE=1500, HANA_NEXT=2000;
  const hanaImg=document.getElementById('hanamaru'), pinpon=document.getElementById('pinpon');
  let hanaHideT=null, hanaNextT=null;
  function clearHana(){ clearTimeout(hanaHideT); clearTimeout(hanaNextT); hanaHideT=hanaNextT=null; hanaImg.classList.remove('show'); }
  // 答えのgの欄のまん中に、欄の高さに合わせた大きさで置く
  function placeHana(){
    const row=document.getElementById('ansG')||panel.querySelector('.inputrow'); if(!row) return;
    const m=hanaImg.offsetParent.getBoundingClientRect(), r=row.getBoundingClientRect();
    hanaImg.style.left=(r.left+r.width/2-m.left)+'px';
    hanaImg.style.top=(r.top+r.height/2-m.top)+'px';
    hanaImg.style.width=Math.round(r.height*2.1)+'px';
  }
  function celebrate(next){
    clearHana(); placeHana();
    try{ pinpon.currentTime=0; const pr=pinpon.play(); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){}
    hanaImg.classList.add('show');
    hanaHideT=setTimeout(()=>hanaImg.classList.remove('show'),HANA_HIDE);
    // チャレンジ中は、10問チャレンジ側が次の問題を出す（nextDelay を HANA_NEXT にそろえてある）
    if(!chalOn()&&next) hanaNextT=setTimeout(next,HANA_NEXT);
  }

  /* ---------- 10問チャレンジ：まちがえたとき ---------- */
  function retry(fb){
    Challenge10.miss();
    setAnswered(false);
    fb.className='feedback ng'; fb.innerHTML='ざんねん…✕<small>もういちど やってみよう</small>';
    panel.querySelectorAll('.inputrow input').forEach(i=>i.value=''); focusFirst();
  }
  // チャレンジ中は「つぎのもんだい」で とばせないようにする
  function lockSkip(){ const on=chalOn(); ['next','cnext'].forEach(id=>{ const b=document.getElementById(id); if(b) b.disabled=on; }); }

  /* ---------- QUIZ ---------- */
  let qScore={correct:0,total:0,streak:0};
  function newQuiz(){
    clearHana();
    Challenge10.newProblem();
    const v=randStep(10,cfg.max,10);
    startG=(cfg.max===2000&&v<1000);   // 1kgに届かないときは、gの欄から入れる
    animateTo(v); showScreen('– – –',false);
    const fb=document.getElementById('qfb'); if(fb){fb.className='feedback';fb.textContent='';}
    setAnswered(false); applyHint();
    panel.querySelectorAll('input').forEach(i=>i.value=''); focusFirst();
  }
  function buildQuiz(){
    screenLabel.textContent='';
    qScore={correct:0,total:0,streak:0};
    const two=cfg.max===2000;
    panel.innerHTML=`<div class="qrow"><div class="q">このはかりは　何${two?'kg何g':'g'}？</div><button class="btn hint" id="hintBtn" type="button">💡 ヒント</button></div>
      <div class="inputrow">${inputsHTML(two)}</div>
      <div class="pad"><button class="btn primary" id="check">こたえあわせ</button>
        <button class="btn ghost" id="next">つぎのもんだい</button></div>
      <div class="feedback" id="qfb"></div>
      <div class="score" id="qscore"></div>`;
    updateScore(); lockSkip(); setupHint('qfb',()=>dialHint(grams));
    document.getElementById('next').onclick=newQuiz;
    document.getElementById('check').onclick=checkQuiz;
    onEnter(checkQuiz,newQuiz);
    newQuiz();
  }
  function updateScore(){ const s=document.getElementById('qscore'); if(s)s.textContent=`せいかい ${qScore.correct} ／ ${qScore.total}　　れんぞく ${qScore.streak}`; }
  function checkQuiz(){
    const two=cfg.max===2000;
    const ans=readAnswer(two); const fb=document.getElementById('qfb');
    if(answered) return;
    if(ans===null){ fb.className='feedback ng'; fb.textContent='数字を入れてね'; return; }
    setAnswered(true);
    qScore.total++;
    if(ans===grams){ qScore.correct++; qScore.streak++; fb.className='feedback ok'; fb.innerHTML='せいかい！〇';
      showScreen(screenValue(grams),true); updateScore(); celebrate(newQuiz); Challenge10.done(); return; }
    qScore.streak=0;
    if(chalOn()){ retry(fb); updateScore(); return; }   // チャレンジ中は答えを見せずに、もういちど
    fb.className='feedback ng'; fb.innerHTML='ざんねん…✕<small>こたえは '+screenValue(grams)+'</small>';
    showScreen(screenValue(grams),true); updateScore();
  }

  /* ---------- PREDICT ---------- */
  const OBJECTS=[
    // c: ヒントで くらべる「にている物」と その重さ
    {e:'🥚',n:'たまご',g:60,c:['うずらのたまご1こ','10g']},{e:'🍌',n:'バナナ',g:150,c:['みかん1こ','100g']},{e:'🍎',n:'りんご',g:300,c:['みかん1こ','100g']},
    {e:'🍊',n:'みかん',g:100,c:['りんご1こ','300g']},{e:'🍅',n:'トマト',g:150,c:['ミニトマト1こ','15g']},{e:'🥔',n:'じゃがいも',g:150,c:['たまねぎ1こ','200g']},
    {e:'🥕',n:'にんじん',g:200,c:['じゃがいも1こ','150g']},{e:'🧅',n:'たまねぎ',g:200,c:['じゃがいも1こ','150g']},{e:'🍞',n:'食パン1きん',g:400,c:['食パン1まい（6まい切り）','60g']},
    {e:'📕',n:'国語の教科書',g:300,c:['ノート1さつ','100g']},{e:'📱',n:'スマートフォン',g:170,c:['テレビのリモコン','100g']},{e:'⚾',n:'やきゅうボール',g:145,c:['テニスボール','60g']},
    {e:'🍚',n:'ごはん1ぱい',g:150,c:['おにぎり1こ','100g']},{e:'👟',n:'スニーカー1足',g:700,c:['うわばき1足','300g']},{e:'🏀',n:'バスケットボール',g:600,c:['サッカーボール','430g']},
    {e:'🥤',n:'ジュース（500mL）',g:520,c:['牛にゅうパック（200mL）','210g']},{e:'🧴',n:'シャンプー',g:600,c:['ジュース（500mL）','520g']},
    {e:'🥛',n:'牛にゅう1本（1L）',g:1030,c:['ジュース（500mL）','520g']},{e:'🎒',n:'ランドセル',g:1200,c:['からっぽのリュックサック','500g']},
    {e:'🍍',n:'パイナップル',g:1500,c:['メロン1こ','1kg']},{e:'🐱',n:'子ねこ',g:1000,c:['ハムスター','100g']}
  ];
  let curObj=null;
  function pickObject(){
    const pool=OBJECTS.filter(o=>o.g<=cfg.max);
    let o; do{ o=pool[Math.floor(Math.random()*pool.length)]; }while(pool.length>1&&o===curObj);
    curObj=o; return o;
  }
  function newPredict(){
    const o=pickObject();
    const oe=panel.querySelector('.emoji'), on=panel.querySelector('.objname');
    oe.textContent=o.e; on.textContent=o.n;
    setNeedle(0); showScreen('– – –',false);
    const fb=document.getElementById('pfb'); if(fb){fb.className='feedback';fb.textContent='';}
    setAnswered(false); applyHint();
    panel.querySelectorAll('input').forEach(i=>i.value=''); focusFirst();
  }
  function buildPredict(){
    screenLabel.textContent='';
    const two=cfg.max===2000;
    panel.innerHTML=`<div class="obj"><div class="emoji"></div><div class="objname"></div><button class="btn hint" id="hintBtn" type="button">💡 ヒント</button></div>
      <div class="q">何${two?'kg何g':'g'}だとおもう？　よそうしよう</div>
      <div class="inputrow">${inputsHTML(two)}</div>
      <div class="pad"><button class="btn reveal" id="reveal2">答えを見る</button>
        <button class="btn ghost" id="nextobj">つぎのもの</button></div>
      <div class="feedback" id="pfb"></div>`;
    setupHint('pfb',()=>predictHint(curObj));
    document.getElementById('nextobj').onclick=newPredict;
    document.getElementById('reveal2').onclick=revealPredict;
    onEnter(revealPredict,newPredict);
    newPredict();
  }
  function revealPredict(){
    const two=cfg.max===2000;
    const pred=readAnswer(two);
    setAnswered(true);
    const actual=clamp(Math.round(curObj.g/cfg.minor)*cfg.minor,0,cfg.max);
    animateTo(actual,()=>showScreen(screenValue(actual),true));
    const fb=document.getElementById('pfb');
    if(pred===null){ fb.className='feedback'; fb.innerHTML='<small>じっさいは '+screenValue(actual)+' でした</small>'; return; }
    const diff=Math.abs(pred-actual);
    const near=Math.max(30,cfg.max*0.03);
    if(diff===0){ fb.className='feedback ok'; fb.innerHTML='ピッタリ！すごい！'; }
    else if(diff<=near){ fb.className='feedback ok'; fb.innerHTML='おしい！とても近い<small>じっさいは '+screenValue(actual)+'（よそうとの差 '+diff+'g）</small>'; }
    else{ fb.className='feedback'; fb.innerHTML='<small>じっさいは '+screenValue(actual)+'（よそうとの差 '+diff+'g）</small>'; }
  }

  /* ---------- CONVERT (always 2kg) ---------- */
  let cVal=0, cType='toKgG';
  function newConvert(){
    clearHana();
    Challenge10.newProblem();
    cVal=randStep(1010,1990,10); if(cVal%1000===0)cVal+=10;

    else{ fb.className='feedback ng'; fb.innerHTML='ざんねん…✕<small>'+fmtKgG(cVal)+' ＝ '+fmtG(cVal)+'</small>'; }

  /* ---------- mode / range switching ---------- */
  function setLocked(lock){ svg.classList.toggle('locked',lock); }
  function enterMode(m){
    clearHana();
    mode=m;
    document.querySelectorAll('.modebar button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
    setLocked(m!=='practice');
    keypad.classList.toggle('off',m==='practice');
    activeInput=null; checkFn=null; nextFn=null; startG=false; hintRender=null; hintOn=false; screenHinted=false; clearMarks(); setAnswered(false);
    // 10問チャレンジは「クイズ」と「g → kg」だけ。切りかえたら数えなおす
    const chalMode=(m==='quiz'||m==='convert');
    chalMount.classList.toggle('hide',!chalMode);
    if(Challenge10.isOn()){ if(chalMode) Challenge10.reset(); else { Challenge10.stop(); document.querySelector('.main').classList.remove('chal-on'); } }
    if(m==='convert'){ rangeBar.classList.add('hide'); if(cfg.max!==2000) selectRange(2000,true); }
    else rangeBar.classList.remove('hide');
    if(m==='practice')buildPractice();
    else if(m==='quiz')buildQuiz();
    else if(m==='predict')buildPredict();
    else if(m==='convert')buildConvert();
  }
  document.querySelectorAll('.modebar button').forEach(b=>b.onclick=()=>enterMode(b.dataset.mode));

  const r1=document.getElementById('range1'), r2=document.getElementById('range2');
  function selectRange(max,quiet){
    cfg=CONFIG[max]; const is1=max===1000;
    r1.classList.toggle('active',is1); r2.classList.toggle('active',!is1);
    unitMark.textContent=is1?'g':'kg / g';
    drawScale(); setNeedle(0);
    if(!quiet) enterMode(mode); // rebuild current mode for the new range
  }
  r1.onclick=()=>selectRange(1000);
  r2.onclick=()=>selectRange(2000);

  // 10問チャレンジの用意
  const chalMount=document.getElementById('chal-mount');
  Challenge10.init({
    mount: chalMount,
    total: 10,
    nextDelay: 2000,   // はなまるが消えてから次の問題へ（HANA_NEXT と同じ）
    next: ()=>{ if(mode==='quiz') newQuiz(); else if(mode==='convert') newConvert(); },
    onToggle: (on)=>{ document.querySelector('.main').classList.toggle('chal-on',on); setAnswered(false); lockSkip(); const fb=panel.querySelector('.feedback'); if(fb){fb.className='feedback';fb.textContent='';} },
    record: false
  });

  // init
  drawScale(); setNeedle(0); enterMode('practice');
})();
</script>
</body>
</html>
